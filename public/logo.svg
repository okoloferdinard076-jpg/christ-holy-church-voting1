<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <radialGradient id="sunburst" cx="50%" cy="58%" r="60%">
      <stop offset="0%" stop-color="#144bc8" />
      <stop offset="100%" stop-color="#072b82" />
    </radialGradient>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Border & Crest Arch -->
  <path d="M 50 260 C 50 90, 350 90, 350 260 L 350 290 L 50 290 Z" fill="url(#sunburst)" stroke="#072b82" stroke-width="4" />
  
  <!-- Radiating Sunburst Rays -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.95" stroke-linecap="round">
    <!-- Center radiation point (200, 240) -->
    <line x1="200" y1="230" x2="65" y2="230" />
    <line x1="200" y1="230" x2="70" y2="210" />
    <line x1="200" y1="230" x2="80" y2="185" />
    <line x1="200" y1="230" x2="95" y2="160" />
    <line x1="200" y1="230" x2="115" y2="140" />
    <line x1="200" y1="230" x2="140" y2="120" />
    <line x1="200" y1="230" x2="170" y2="105" />
    <line x1="200" y1="230" x2="200" y2="100" />
    <line x1="200" y1="230" x2="230" y2="105" />
    <line x1="200" y1="230" x2="260" y2="120" />
    <line x1="200" y1="230" x2="285" y2="140" />
    <line x1="200" y1="230" x2="305" y2="160" />
    <line x1="200" y1="230" x2="320" y2="185" />
    <line x1="200" y1="230" x2="330" y2="210" />
    <line x1="200" y1="230" x2="335" y2="230" />

    <!-- Additional fine inner rays -->
    <line x1="200" y1="230" x2="75" y2="198" stroke-width="1.5" />
    <line x1="200" y1="230" x2="87" y2="172" stroke-width="1.5" />
    <line x1="200" y1="230" x2="105" y2="150" stroke-width="1.5" />
    <line x1="200" y1="230" x2="127" y2="130" stroke-width="1.5" />
    <line x1="200" y1="230" x2="155" y2="112" stroke-width="1.5" />
    <line x1="200" y1="230" x2="185" y2="102" stroke-width="1.5" />
    <line x1="200" y1="230" x2="215" y2="102" stroke-width="1.5" />
    <line x1="200" y1="230" x2="245" y2="112" stroke-width="1.5" />
    <line x1="200" y1="230" x2="273" y2="130" stroke-width="1.5" />
    <line x1="200" y1="230" x2="295" y2="150" stroke-width="1.5" />
    <line x1="200" y1="230" x2="313" y2="172" stroke-width="1.5" />
    <line x1="200" y1="230" x2="325" y2="198" stroke-width="1.5" />
  </g>

  <!-- Orb / Mount at base of cross -->
  <circle cx="200" cy="240" r="32" fill="#ffffff" stroke="#072b82" stroke-width="2" />

  <!-- Center Cross with Flared Arms -->
  <path d="M 194 135 L 206 135 L 206 175 L 235 175 L 235 187 L 206 187 L 206 215 L 194 215 L 194 187 L 165 187 L 165 175 L 194 175 Z" fill="#ffffff" stroke="#072b82" stroke-width="2" stroke-linejoin="round" />

  <!-- Crown / Top Scepter Details -->
  <path d="M 190 65 L 210 65 L 208 100 L 192 100 Z" fill="#ffffff" stroke="#072b82" stroke-width="1.5" />
  
  <!-- Holy Spirit Dove at Crown -->
  <g fill="#ffffff" stroke="#072b82" stroke-width="2" stroke-linejoin="round">
    <!-- Wings outstretched -->
    <path d="M 130 90 C 150 75, 180 75, 200 95 C 220 75, 250 75, 270 90 C 265 105, 240 120, 200 125 C 160 120, 135 105, 130 90 Z" />
    <!-- Dove Body and Head -->
    <ellipse cx="200" cy="100" rx="14" ry="20" />
    <!-- Dove Crown / Head Top -->
    <path d="M 185 55 L 200 45 L 215 55 L 208 65 L 192 65 Z" fill="#ffffff" stroke="#072b82" stroke-width="2" />
    <!-- Dove Wing Feather scallops -->
    <path d="M 130 90 L 142 100 L 155 108 L 170 114 L 185 118" fill="none" stroke="#072b82" stroke-width="1.5" />
    <path d="M 270 90 L 258 100 L 245 108 L 230 114 L 215 118" fill="none" stroke="#072b82" stroke-width="1.5" />
  </g>

  <!-- Open Holy Bible Base -->
  <g filter="url(#subtle-shadow)">
    <!-- Bible Base Cover Outline (Blue with Red Accent) -->
    <path d="M 30 265 L 75 260 L 200 275 L 325 260 L 370 265 L 350 375 L 200 370 L 50 375 Z" fill="#072b82" stroke="#051f61" stroke-width="3" />

    <!-- Open White Pages -->
    <path d="M 45 270 C 110 255, 180 270, 200 278 C 220 270, 290 255, 355 270 L 340 355 C 280 342, 220 355, 200 358 C 180 355, 120 342, 60 355 Z" fill="#ffffff" stroke="#e11d48" stroke-width="2" />

    <!-- Left / Right Inner page divider curve -->
    <line x1="200" y1="278" x2="200" y2="358" stroke="#072b82" stroke-width="2" />

    <!-- CHC Letters in Bold Royal Blue -->
    <text x="200" y="332" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="46" fill="#072b82" text-anchor="middle" letter-spacing="4">CHC</text>

    <!-- Bottom Red Ribbon Banner -->
    <path d="M 45 352 C 110 342, 175 355, 200 358 C 225 355, 290 342, 355 352 L 350 376 C 285 364, 225 378, 200 380 C 175 378, 115 364, 50 376 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />

    <!-- Inscribed JOHN 10:10 Text on Red Ribbon -->
    <text x="135" y="370" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">JOHN</text>
    <text x="265" y="370" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">10:10</text>
  </g>
</svg>
